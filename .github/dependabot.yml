# Routine version updates wait seven days; security fixes are not delayed.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-minor-and-patch:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: nuget
  directory: /
  # Accepted Avalonia 11 compatibility limit: realgarit/phonedesk#203.
  # Dependabot rejects open NuGet interval notation such as "[12.0.0,)"
  # (illformed_requirement), so the limits use comparison operators.
  # The updater can still step past these while it resolves a related update
  # (PR 243); PhoneDesk.Tests/DependencyLimitTests.cs fails such a PR.
  ignore:
  - dependency-name: "Avalonia*"
    versions: [">= 12.0.0"]
  - dependency-name: "FluentAvaloniaUI"
    versions: [">= 3.0.0"]
  - dependency-name: "FluentIcons.Avalonia"
    versions: ["> 1.1.223"]
  # PowerShell 7.7 targets net11.0 only; the app stays on net10.0 (LTS).
  # Remove both entries together with the move to .NET 11.
  - dependency-name: "Microsoft.PowerShell.SDK"
    versions: [">= 7.7.0"]
  - dependency-name: "System.Management.Automation"
    versions: [">= 7.7.0"]
  # The MCP server shares the app folder. Hosting 11 ships System.* files that differ from the
  # .NET 10 runtime files of the app; scripts/publish-mcp-server.sh fails on such a difference.
  - dependency-name: "Microsoft.Extensions.Hosting"
    versions: [">= 11.0.0"]
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-minor-and-patch:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
