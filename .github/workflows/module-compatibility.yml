name: Module Compatibility Check

# Weekly best-effort check for newer PowerShell Gallery releases of the bundled modules
# (see Scripts/module-versions.json). Never triggers on push/pull_request: it only runs on
# its own schedule (plus manual dispatch) so it can't slow down or block normal CI.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-module-versions:
    name: Check for newer module versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pushes made with GITHUB_TOKEN do not start other workflows, so the update PR would
          # wait for a manual CI approval. PAT_TOKEN pushes run Build and Release normally.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify push token
        env:
          HAS_PAT: ${{ secrets.PAT_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_PAT" != "true" ]]; then
            echo "::warning::PAT_TOKEN is not set. Update PRs will need a manual CI approval."
            exit 0
          fi
          # Fails early when PAT_TOKEN has expired or lost write access to this repository.
          git push --dry-run origin HEAD:refs/heads/module-compatibility/token-check

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Query PowerShell Gallery for latest versions
        id: query
        run: |
          set -euo pipefail
          VERSIONS_FILE="scripts/module-versions.json"
          HAS_UPDATE=false
          SUMMARY_FILE="$RUNNER_TEMP/version-summary.md"
          : > "$SUMMARY_FILE"

          NAMES=$(jq -r '.modules[].name' "$VERSIONS_FILE")
          for NAME in $NAMES; do
            CURRENT=$(jq -r --arg name "$NAME" '.modules[] | select(.name == $name) | .version' "$VERSIONS_FILE")

            # Best-effort: PowerShell Gallery v2 OData feed, latest version for the module id.
            LATEST=$(curl -fsSL "https://www.powershellgallery.com/api/v2/Packages()?\$filter=Id%20eq%20%27${NAME}%27%20and%20IsLatestVersion&\$orderby=Version%20desc&\$top=1" \
              | grep -o '<d:Version>[^<]*</d:Version>' \
              | head -1 \
              | sed -e 's/<d:Version>//' -e 's/<\/d:Version>//' || true)

            if [[ -z "$LATEST" ]]; then
              echo "::warning::Could not determine latest version for $NAME, skipping."
              continue
            fi

            echo "$NAME: current=$CURRENT latest=$LATEST"
            if [[ "$LATEST" != "$CURRENT" ]]; then
              HAS_UPDATE=true
              echo "- **$NAME**: \`$CURRENT\` → \`$LATEST\` ([changelog](https://www.powershellgallery.com/packages/${NAME}/${LATEST}))" >> "$SUMMARY_FILE"
              jq --arg name "$NAME" --arg version "$LATEST" \
                '(.modules[] | select(.name == $name) | .version) = $version' \
                "$VERSIONS_FILE" > "$VERSIONS_FILE.tmp"
              mv "$VERSIONS_FILE.tmp" "$VERSIONS_FILE"
            fi
          done

          echo "has_update=$HAS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Build and test with updated pins
        if: steps.query.outputs.has_update == 'true'
        id: build
        continue-on-error: true
        run: |
          # pipefail: without it `tee` hides a test failure and the PR would still be opened.
          set -euo pipefail
          dotnet restore PhoneDesk.slnx
          dotnet build PhoneDesk.slnx --configuration Release --no-restore
          dotnet test PhoneDesk.Tests/PhoneDesk.Tests.csproj --configuration Release --no-build 2>&1 | tee "$RUNNER_TEMP/build-output.log"

      - name: Open or update pull request with bumped versions
        if: steps.query.outputs.has_update == 'true' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          SUMMARY_FILE: ${{ steps.query.outputs.summary_file }}
        run: |
          set -euo pipefail
          # One fixed branch: a later run updates the open PR instead of opening another one.
          BRANCH="module-compatibility/bundled-modules"
          TITLE="fix(deps): bump bundled PowerShell module versions"
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            echo "Weekly module compatibility check found newer versions on the PowerShell Gallery."
            echo
            cat "$SUMMARY_FILE"
            echo
            echo "Build and tests passed against the updated pins. Review the changelog links above before merging."
          } > "$BODY_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add scripts/module-versions.json
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            PR="$EXISTING"
          else
            PR=$(gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE")
          fi

          # Close update PRs from the old dated branches; the PR above carries the newer pins.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"module-compatibility/\")) | select(.headRefName != \"$BRANCH\") | .number" |
          while read -r OLD; do
            gh pr close "$OLD" --delete-branch --comment "Superseded by $PR."
          done

      - name: Open or update issue on build/test failure
        if: steps.query.outputs.has_update == 'true' && steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_FILE: ${{ steps.query.outputs.summary_file }}
        run: |
          set -euo pipefail
          TITLE="Module compatibility check: build/test failure with newer module versions"
          BODY_FILE="$RUNNER_TEMP/issue-body.md"
          {
            echo "The weekly module compatibility check found newer versions of one or more bundled"
            echo "PowerShell modules, but the build/test run against the updated pins failed. No PR"
            echo "was opened; the pin file was left unchanged."
            echo
            cat "$SUMMARY_FILE"
            echo
            echo "Build/test output:"
            echo
            echo '```'
            tail -c 20000 "$RUNNER_TEMP/build-output.log" 2>/dev/null || echo "No output captured."
            echo '```'
          } > "$BODY_FILE"

          # Comment on the open failure issue instead of opening a new one every week.
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
