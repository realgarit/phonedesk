name: Publish Microsoft Store Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to copy to gh-pages (for recovery)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-store-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name || inputs.tag }} to gh-pages
    runs-on: ubuntu-latest

    steps:
    - name: Resolve release tag
      id: release
      env:
        EVENT_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        TAG="${EVENT_TAG:-$INPUT_TAG}"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag '$TAG' is not a stable semantic version."
          exit 1
        fi

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - name: Checkout gh-pages
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: gh-pages
        path: pages
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Download and verify release installer
      id: asset
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        set -euo pipefail
        DOWNLOAD_DIR="$RUNNER_TEMP/phonedesk-store-release"
        mkdir -p "$DOWNLOAD_DIR"
        gh release download "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern phonedesk-win-x64-setup.exe \
          --dir "$DOWNLOAD_DIR" \
          --clobber

        INSTALLER="$DOWNLOAD_DIR/phonedesk-win-x64-setup.exe"
        if [[ ! -f "$INSTALLER" ]]; then
          echo "::error::The published release '$TAG' has no phonedesk-win-x64-setup.exe asset."
          exit 1
        fi

        RELEASE_DIGEST="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "phonedesk-win-x64-setup.exe") | .digest' | sed 's/^sha256://')"
        if [[ ! "$RELEASE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Could not resolve a SHA-256 digest for the published installer."
          exit 1
        fi

        ACTUAL_DIGEST="$(sha256sum "$INSTALLER" | awk '{print $1}')"
        if [[ "$ACTUAL_DIGEST" != "$RELEASE_DIGEST" ]]; then
          echo "::error::Downloaded installer digest '$ACTUAL_DIGEST' does not match release digest '$RELEASE_DIGEST'."
          exit 1
        fi

        echo "digest=$RELEASE_DIGEST" >> "$GITHUB_OUTPUT"
        echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
        echo "Verified release installer digest: $RELEASE_DIGEST"

    - name: Stage versioned Store package
      env:
        VERSION: ${{ steps.release.outputs.version }}
        INSTALLER: ${{ steps.asset.outputs.installer }}
      run: |
        set -euo pipefail
        STORE_PATH="pages/store/${VERSION}/phonedesk-win-x64-setup.exe"
        mkdir -p "$(dirname "$STORE_PATH")"
        cp "$INSTALLER" "$STORE_PATH"
        test -f "$STORE_PATH"
        echo "Staged $STORE_PATH"

    - name: Commit and push gh-pages package
      working-directory: pages
      env:
        TAG: ${{ steps.release.outputs.tag }}
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        set -euo pipefail
        STORE_PATH="store/${VERSION}/phonedesk-win-x64-setup.exe"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$STORE_PATH"

        if git diff --cached --quiet; then
          echo "Store package unchanged, nothing to push"
        else
          CHANGED_FILES="$(git diff --cached --name-only)"
          if [[ "$CHANGED_FILES" != "$STORE_PATH" ]]; then
            echo "::error::Unexpected gh-pages changes staged: $CHANGED_FILES"
            exit 1
          fi
          git commit -m "chore: host ${TAG} installer for Microsoft Store package URL"
          git push origin HEAD:gh-pages
        fi

    - name: Verify public Store package URL
      env:
        VERSION: ${{ steps.release.outputs.version }}
        RELEASE_DIGEST: ${{ steps.asset.outputs.digest }}
        PAGES_BASE_URL: https://realgarit.github.io/phonedesk
      run: |
        set -euo pipefail
        STORE_URL="${PAGES_BASE_URL}/store/${VERSION}/phonedesk-win-x64-setup.exe"
        DOWNLOAD="$RUNNER_TEMP/phonedesk-store-live.exe"
        HEADERS="$RUNNER_TEMP/phonedesk-store-live.headers"
        MAX_ATTEMPTS=30

        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          rm -f "$DOWNLOAD" "$HEADERS"
          if curl --silent --show-error --max-time 30 --max-redirs 0 \
            --dump-header "$HEADERS" --output "$DOWNLOAD" "$STORE_URL"; then
            STATUS="$(awk 'NR == 1 {print $2; exit}' "$HEADERS")"
            if [[ "$STATUS" == "200" ]] && ! grep -qi '^location:' "$HEADERS"; then
              SERVED_DIGEST="$(sha256sum "$DOWNLOAD" | awk '{print $1}')"
              if [[ "$SERVED_DIGEST" == "$RELEASE_DIGEST" ]]; then
                echo "Verified non-redirecting Pages URL with matching digest: $STORE_URL"
                exit 0
              fi
              echo "Attempt $attempt/$MAX_ATTEMPTS: Pages returned digest '$SERVED_DIGEST', expected '$RELEASE_DIGEST'."
            else
              echo "Attempt $attempt/$MAX_ATTEMPTS: Pages returned HTTP '$STATUS' or a redirect."
            fi
          else
            echo "Attempt $attempt/$MAX_ATTEMPTS: Pages URL is not available yet."
          fi

          if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
            sleep 10
          fi
        done

        echo "::error::Pages did not serve the expected non-redirecting installer after $MAX_ATTEMPTS attempts: $STORE_URL"
        exit 1
